# Free-tier Supabase projects pause after a week without API traffic.
# This pings the REST API every two days so the project stays active.
# Uses the public anon key, which is safe to expose (it's shipped in the app).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */2 * *" # every 2 days at 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        env:
          SUPABASE_URL: https://tdctzjjjxojgoavybmtn.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/groups?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
